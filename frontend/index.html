<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentiment Analyser</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --border: #2a2a32;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --accent: #7c6ff7;
      --positive: #34d399;
      --negative: #f87171;
      --neutral: #fbbf24;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 640px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    header h1 span {
      color: var(--accent);
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 140px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 14px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea::placeholder { color: var(--muted); }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      padding: 11px 24px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      flex: 1;
    }

    .btn-clear {
      background: var(--border);
      color: var(--muted);
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Result */
    #result { display: none; }

    .sentiment-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-transform: capitalize;
    }

    .badge-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .positive .badge-dot { background: var(--positive); }
    .negative .badge-dot { background: var(--negative); }
    .neutral  .badge-dot { background: var(--neutral); }
    .positive { color: var(--positive); }
    .negative { color: var(--negative); }
    .neutral  { color: var(--neutral); }

    .score-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .score-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .bar-track {
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    }

    .bar-positive { background: var(--positive); }
    .bar-negative { background: var(--negative); }

    .error-msg {
      color: var(--negative);
      font-size: 0.9rem;
      margin-top: 10px;
      display: none;
    }

    /* Loader */
    .loader {
      display: none;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 32px;
    }

    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sentiment <span>Analyser</span></h1>
      <p>Paste any text — review, tweet, comment — and get an instant read.</p>
    </header>

    <div class="card">
      <textarea id="inputText" placeholder="Type or paste text here…"></textarea>
      <div class="actions">
        <button class="btn-primary" id="analyzeBtn" onclick="analyze()">Analyse</button>
        <button class="btn-clear" onclick="clearAll()">Clear</button>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="card" id="result">
      <div class="sentiment-badge" id="sentimentBadge">
        <span class="badge-dot"></span>
        <span id="sentimentLabel"></span>
        <span style="font-size:1rem; font-weight:400; color: var(--muted)" id="confidenceLabel"></span>
      </div>

      <div class="score-row">
        <div>
          <div class="score-label">
            <span>Positive</span>
            <span id="posScore"></span>
          </div>
          <div class="bar-track">
            <div class="bar-fill bar-positive" id="posBar" style="width:0%"></div>
          </div>
        </div>
        <div>
          <div class="score-label">
            <span>Negative</span>
            <span id="negScore"></span>
          </div>
          <div class="bar-track">
            <div class="bar-fill bar-negative" id="negBar" style="width:0%"></div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      Built by <a href="https://github.com/TJDEBUGGED" target="_blank">Harry Tijani</a> ·
      Trained on movie reviews · <a href="/docs" target="_blank">API docs</a>
    </footer>
  </div>

  <script>
    async function analyze() {
      const text = document.getElementById('inputText').value.trim();
      const btn  = document.getElementById('analyzeBtn');
      const err  = document.getElementById('errorMsg');
      const res  = document.getElementById('result');

      err.style.display = 'none';
      if (!text) { showError('Please enter some text.'); return; }

      btn.disabled = true;
      btn.textContent = 'Analysing…';

      try {
        const response = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });

        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.detail || 'Something went wrong.');
        }

        const data = await response.json();
        showResult(data);
      } catch (e) {
        showError(e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Analyse';
      }
    }

    function showResult(data) {
      const badge = document.getElementById('sentimentBadge');
      badge.className = `sentiment-badge ${data.sentiment}`;
      document.getElementById('sentimentLabel').textContent = data.sentiment;
      document.getElementById('confidenceLabel').textContent =
        `(${(data.confidence * 100).toFixed(1)}% confidence)`;

      const pos = data.scores.positive;
      const neg = data.scores.negative;
      document.getElementById('posScore').textContent = (pos * 100).toFixed(1) + '%';
      document.getElementById('negScore').textContent = (neg * 100).toFixed(1) + '%';
      document.getElementById('posBar').style.width = (pos * 100) + '%';
      document.getElementById('negBar').style.width = (neg * 100) + '%';

      document.getElementById('result').style.display = 'block';
    }

    function showError(msg) {
      const err = document.getElementById('errorMsg');
      err.textContent = msg;
      err.style.display = 'block';
    }

    function clearAll() {
      document.getElementById('inputText').value = '';
      document.getElementById('result').style.display = 'none';
      document.getElementById('errorMsg').style.display = 'none';
    }

    document.getElementById('inputText').addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.ctrlKey) analyze();
    });
  </script>
</body>
</html>
